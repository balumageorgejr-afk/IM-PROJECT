# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: campus-facility-management
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.0.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-facility-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PROVISION_ADMIN_EMAIL
        value: admin@campus.edu
      - key: PROVISION_ADMIN_FIRST_NAME
        value: System
      - key: PROVISION_ADMIN_LAST_NAME
        value: Administrator
      - key: PROVISION_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: campus-facility-db
    databaseName: campus_facility_db
    user: campus_admin
    plan: free

